<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каса на 2. клас</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#202124; --muted:#6b7280;
  --accent:#5b5bd6; --green:#18864b; --red:#c62828; --border:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1050px;margin:auto;padding:22px}
header{background:linear-gradient(135deg,#5b5bd6,#7777e8);color:white;border-radius:20px;padding:26px;margin-bottom:18px}
h1{margin:0 0 6px;font-size:28px} header p{margin:0;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 2px 8px #00000008}
.label{font-size:13px;color:var(--muted);margin-bottom:8px}
.value{font-size:25px;font-weight:700}
.green{color:var(--green)} .red{color:var(--red)}
.section{margin-top:18px}
.section h2{font-size:20px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}
th,td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left}
th{font-size:13px;color:var(--muted);background:#fafafa}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
.paid{background:#e7f7ee;color:var(--green)} .unpaid{background:#fdeaea;color:var(--red)}
.yes{color:var(--green);font-weight:700}.no{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}table{font-size:13px}th,td{padding:9px 7px}}
@media(max-width:450px){.container{padding:12px}.grid{gap:8px}.card{padding:13px}.value{font-size:21px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>💼 Каса на 2. клас</h1>
  <p>Първи срок • учебна 2026/2027 г.</p>
</header>

<div class="grid">
  <div class="card"><div class="label">Събрани средства</div><div id="income" class="value green">—</div></div>
  <div class="card"><div class="label">Разходи</div><div id="expenses" class="value red">—</div></div>
  <div class="card"><div class="label">Наличност</div><div id="balance" class="value">—</div></div>
  <div class="card"><div class="label">Платили</div><div id="paidCount" class="value">—</div></div>
</div>

<div class="section card">
  <h2>👧👦 Вноски</h2>
  <div style="overflow-x:auto">
  <table>
    <thead><tr><th>Дете</th><th>Сума</th><th>Дарение</th><th>Статус</th><th>Дата</th></tr></thead>
    <tbody id="payments"></tbody>
  </table>
  </div>
</div>

<div class="section card">
  <h2>💸 Разходи</h2>
  <div style="overflow-x:auto">
  <table>
    <thead><tr><th>Дата</th><th>Разход</th><th>Сума</th></tr></thead>
    <tbody id="expensesTable"></tbody>
  </table>
  </div>
</div>

<div class="section card">
  <h2>📊 Обобщение</h2>
  <div id="summary"></div>
  <div class="note">Всички суми са в евро. Данните се зареждат от Google Sheets.</div>
</div>

<footer>Касиер: Диана Иванова • Последна актуализация: <span id="updated"></span></footer>
</div>

<script>
const PAYMENTS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_zaXIrcdTqmLpeTWq8edkbSmYyYNe0lJrroURAAujOCIiKuzd6Uere94hAozE1ZBF5RpE9LVvUlnK/pub?gid=0&single=true&output=csv";
const EXPENSES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_zaXIrcdTqmLpeTWq8edkbSmYyYNe0lJrroURAAujOCIiKuzd6Uere94hAozE1ZBF5RpE9LVvUlnK/pub?gid=864724706&single=true&output=csv";

const TOTAL_CHILDREN = 24; // ФИКСИРАН БРОЙ ДЕЦА В КЛАСА

function euro(n){return Number(n||0).toFixed(2)+" €"}
function isYes(v){return /^(да|yes|true|1|платено)$/i.test(String(v).trim())}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function parseCSV(text){
  return text.trim().split('/n').map(line => 
    line.split(',').map(cell => cell.trim().replace(/^"|"$/g, ''))
  );
}

let dataLoaded = false;

function render(payments, expenses){
  const income = payments.reduce((s,r)=>s+(parseFloat(String(r[1]).replace(",", "."))||0),0);
  const expenseTotal = expenses.reduce((s,r)=>s+(parseFloat(String(r[2]).replace(",", "."))||0),0);
  const balance=income-expenseTotal;

  document.getElementById("income").textContent=euro(income);
  document.getElementById("expenses").textContent=euro(expenseTotal);
  document.getElementById("balance").textContent=euro(balance);
  document.getElementById("paidCount").textContent=payments.length+" / "+TOTAL_CHILDREN;

  document.getElementById("payments").innerHTML=payments.map(r=>{
    return `<tr>
      <td>${escapeHtml(r[0]||"")}</td>
      <td>${euro(parseFloat(String(r[1]).replace(",","."))||0)}</td>
      <td>${isYes(r[2])?'<span class="yes">Да</span>':'<span class="no">Не</span>'}</td>
      <td><span class="badge paid">Платено</span></td>
      <td>${escapeHtml(r[3]||"—")}</td>
    </tr>`
  }).join("");

  document.getElementById("expensesTable").innerHTML=expenses.map(r=>`<tr>
    <td>${escapeHtml(r[0]||"")}</td><td>${escapeHtml(r[1]||"")}</td>
    <td>${euro(parseFloat(String(r[2]).replace(",","."))||0)}</td>
  </tr>`).join("");

  const withDonation = payments.filter(r=>isYes(r[2])).length;
  const remaining = TOTAL_CHILDREN - payments.length;
  
  document.getElementById("summary").innerHTML=
    `<p>👥 Общо вноски: <b>${payments.length}</b></p>
     <p>✅ Платили: <b>${payments.length}</b> от ${TOTAL_CHILDREN}</p>
     <p>⏳ Остават: <b>${remaining}</b></p>
     <p>💝 С дарение: <b>${withDonation}</b></p>
     <p>💰 Наличност: <b>${euro(balance)}</b></p>`;
  document.getElementById("updated").textContent=new Date().toLocaleString("bg-BG");
  dataLoaded = true;
}

async function load(){
  if(dataLoaded) return;
  document.getElementById("summary").innerHTML = `<p>🔄 Зареждане...</p>`;
  try{
    const [pRaw, eRaw]=await Promise.all([
      fetch(PAYMENTS_CSV_URL).then(r=>r.text()),
      fetch(EXPENSES_CSV_URL).then(r=>r.text())
    ]);
    
    const payments=parseCSV(pRaw).slice(1);
    const expenses=parseCSV(eRaw).slice(1);
    
    if(payments.length === 0 || expenses.length === 0){
      throw new Error(`Празни данни! Вноски: ${payments.length}, Разходи: ${expenses.length}`);
    }
    
    render(payments,expenses);
  }catch(err){
    console.error(err);
    document.getElementById("summary").innerHTML = `<p style="color:#c62828">❌ Грешка: ${err.message}</p>`;
  }
}
load();
</script>
</body>
</html>
