
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каса на 2. клас</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#202124}
.container{max-width:1000px;margin:auto;padding:20px}
h1{color:#5b5bd6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
th{background:#f9fafb;font-weight:600}
.value{font-size:24px;font-weight:700}
.green{color:#18864b}
.red{color:#c62828}
</style>
</head>
<body>
<div class="container">
<h1>💼 Каса на 2. клас</h1>

<div class="card">
  <h2>📊 Обобщение</h2>
  <p>Събрани средства: <span id="income" class="value green">—</span></p>
  <p>Разходи: <span id="expenses" class="value red">—</span></p>
  <p>Наличност: <span id="balance" class="value">—</span></p>
  <p>Платили: <span id="paidCount" class="value">—</span></p>
</div>

<div class="card">
  <h2>👧👦 Вноски</h2>
  <table>
    <thead><tr><th>Дете</th><th>Сума</th><th>Дарение</th><th>Статус</th><th>Дата</th></tr></thead>
    <tbody id="payments"></tbody>
  </table>
</div>

<div class="card">
  <h2>💸 Разходи</h2>
  <table>
    <thead><tr><th>Дата</th><th>Разход</th><th>Сума</th></tr></thead>
    <tbody id="expensesTable"></tbody>
  </table>
</div>

<div class="card">
  <h2>📝 Статус</h2>
  <p id="status">Зареждане...</p>
</div>
</div>

<script>
const SHEET_ID = "1l_YKf6dAtY7aXTo76IuwTFENJ9LymvDm";
const PAYMENTS_GID = "1978905029";
const EXPENSES_GID = "1799746150";

// CORS proxy за заобикаляне на ограничението
const PROXY = "https://api.allorigins.win/raw?url=";

const PAYMENTS_CSV = PROXY + encodeURIComponent(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${PAYMENTS_GID}`);
const EXPENSES_CSV = PROXY + encodeURIComponent(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${EXPENSES_GID}`);

function euro(n){return Number(n||0).toFixed(2)+" €"}
function isYes(v){return /^(да|yes|true|1|платено)$/i.test(String(v).trim())}

function parseCSV(text){
  const rows=[]; let row=[], cell="", quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c==='"' && quote && n==='"'){cell+='"';i++;continue}
    if(c==='"'){quote=!quote;continue}
    if(c===',' && !quote){row.push(cell.trim());cell="";continue}
    if((c==='
'||c==='
') && !quote){
      if(c==='
'&&n==='
')i++;
      row.push(cell.trim());cell="";
      if(row.some(x=>x!==""))rows.push(row);
      row=[];continue;
    }
    cell+=c;
  }
  if(cell||row.length){row.push(cell.trim());if(row.some(x=>x!==""))rows.push(row)}
  return rows;
}

async function load(){
  try{
    document.getElementById("status").textContent = "Зареждане на данни от Google Sheets...";
    
    const [pText, eText] = await Promise.all([
      fetch(PAYMENTS_CSV).then(r=>{
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      }),
      fetch(EXPENSES_CSV).then(r=>{
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
    ]);
    
    let pRows = parseCSV(pText).slice(1);
    let eRows = parseCSV(eText).slice(1);
    
    const paid = pRows.filter(r=>isYes(r[3]));
    const income = paid.reduce((s,r)=>s+(parseFloat(r[1].replace(",","."))||0),0);
    const expenseTotal = eRows.reduce((s,r)=>s+(parseFloat(r[2].replace(",","."))||0),0);
    const balance = income - expenseTotal;
    
    document.getElementById("income").textContent = euro(income);
    document.getElementById("expenses").textContent = euro(expenseTotal);
    document.getElementById("balance").textContent = euro(balance);
    document.getElementById("paidCount").textContent = paid.length + " / " + pRows.length;
    
    document.getElementById("payments").innerHTML = pRows.map(r=>`
      <tr>
        <td>${r[0]||""}</td>
        <td>${euro(parseFloat(r[1].replace(",","."))||0)}</td>
        <td>${isYes(r[2])?"✅ Да":"❌ Не"}</td>
        <td>${isYes(r[3])?"🟢 Платено":"🔴 Неплатено"}</td>
        <td>${r[4]||"—"}</td>
      </tr>
    `).join("");
    
    document.getElementById("expensesTable").innerHTML = eRows.map(r=>`
      <tr>
        <td>${r[0]||"—"}</td>
        <td>${r[1]||""}</td>
        <td>${euro(parseFloat(r[2].replace(",","."))||0)}</td>
      </tr>
    `).join("");
    
    document.getElementById("status").textContent = "✅ Данните са заредени успешно!";
  }catch(err){
    document.getElementById("status").textContent = "❌ Грешка: " + err.message;
    console.error(err);
  }
}

load();
</script>
</body>
</html>
